declaration:
  call: declare
  version: 0.1
  description: "Quality overview metric for chat analytics"
  method: post
  accepts: json
  returns: json
  namespace: analytics
  allowlist:
    body:
      - field: end_date
        type: string
        description: "Body field 'end_date'"
      - field: excluded_quality
        type: object
        description: "Body field 'excluded_quality'"
      - field: start_date
        type: string
        description: "Body field 'start_date'"
      - field: urls
        type: array
        description: "Body field 'urls'"
      - field: showTest
        type: boolean
        description: "Body field 'showTest'"

check_for_required_parameters:
  switch:
    - condition: ${incoming.body.start_date == null || incoming.body.end_date == null}
      next: return_incorrect_request
  next: post_step

post_step:
  call: http.post
  args:
    url: "[#ANALYTICS_RESQL]/chat-quality-rating-overview"
    body:
      start: ${incoming.body.start_date}
      end: ${incoming.body.end_date}
      excluded_quality: ${incoming.body.excluded_quality}
      urls: ${incoming.body.urls}
      showTest: ${incoming.body.showTest}
  result: result

post_summary_data:
  call: http.post
  args:
    url: "[#ANALYTICS_RESQL]/chat-quality-overview-summary"
    body:
      start: ${incoming.body.start_date}
      end: ${incoming.body.end_date}
      urls: ${incoming.body.urls}
      showTest: ${incoming.body.showTest}
  result: summary_result

return_value:
  return: ${[result.response.body, summary_result.response.body]}
  next: end

return_incorrect_request:
  status: 400
  return: 'missing parameters'
  next: end
