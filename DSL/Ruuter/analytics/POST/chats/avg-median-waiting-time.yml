declaration:
  call: declare
  version: 0.1
  description: "Decription placeholder for 'AVG-MEDIAN-WAITING-TIME'"
  method: post
  accepts: json
  returns: json
  namespace: analytics
  allowlist:
    body:
      - field: end_date
        type: string
        description: "Body field 'end_date'"
      - field: options
        type: string
        description: "Body field 'options'"
      - field: period
        type: string
        description: "Body field 'period'"
      - field: start_date
        type: string
        description: "Body field 'start_date'"
      - field: urls
        type: array
        description: "Body field 'urls'"
      - field: showTest
        type: boolean
        description: "Body field 'showTest'"

check_for_body:
  switch:
    - condition: ${incoming.body == null}
      next: missing_parameter

extract_request_data:
  assign:
    options: ${incoming.body.options}
    start: ${incoming.body.start_date}
    end: ${incoming.body.end_date}
    period: ${incoming.body.period}
    urls: ${incoming.body.urls}
    showTest: ${incoming.body.showTest}

check_for_required_parameters:
  switch:
    - condition: ${start == null || end == null || options == null || period == null}
      next: missing_parameter
  next: check_avg

missing_parameter:
  status: 400
  return: 'required parameters were not provided'
  next: end

check_avg:
  switch:
    - condition: ${options.includes('avg')}
      next: avg

empty_avg:
  assign:
    avg_result: ${[]}
  next: check_median

avg:
  call: http.post
  args:
    url: "[#ANALYTICS_RESQL]/chat-avg-waiting-time"
    body:
      period: ${period}
      start: ${start}
      end: ${end}
      urls: ${urls}
      showTest: ${showTest}
  result: results

assign_avg:
  assign: 
    avg_result: ${results.response.body}

check_median:
  switch:
    - condition: ${options.includes('median')}
      next: median

empty_median:
  assign:
    median_result: ${[]}
  next: check_handoff

median:
  call: http.post
  args:
    url: "[#ANALYTICS_RESQL]/chat-median-waiting-time"
    body:
      period: ${period}
      start: ${start}
      end: ${end}
      urls: ${urls}
      showTest: ${showTest}
  result: results

assign_median:
  assign:
    median_result: ${results.response.body}
  next: check_handoff

check_handoff:
  switch:
    - condition: ${options.includes('handoff')}
      next: handoff

empty_handoff:
  assign:
    handoff_result: ${[]}
  next: respond

handoff:
  call: http.post
  args:
    url: "[#ANALYTICS_RESQL]/overview-avg-waiting-time-range"
    body:
      start: ${start}
      end: ${end}
      urls: ${urls}
      showTest: ${showTest}
  result: results

assign_handoff:
  assign:
    handoff_result: ${results.response.body}

respond:
  return: ${[avg_result, median_result, handoff_result]}
