declaration:
  call: declare
  version: 0.1
  description: "Decription placeholder for 'AVG'"
  method: post
  accepts: json
  returns: json
  namespace: analytics
  allowlist:
    body:
      - field: end_date
        type: string
        description: "Body field 'end_date'"
      - field: metric
        type: string
        description: "Body field 'metric'"
      - field: start_date
        type: string
        description: "Body field 'start_date'"
      - field: urls
        type: array
        description: "Body field 'urls'"
      - field: showTest
        type: boolean
        description: "Body field 'showTest'"
      - field: combined
        type: boolean
        description: "Body field 'combined'"

check_for_required_parameters:
  switch:
    - condition: ${incoming.body == null || incoming.body.start_date == null || incoming.body.end_date == null}
      next: return_incorrect_request
  next: check_combined

check_combined:
  switch:
    - condition: ${incoming.body.combined == true}
      next: post_step_combined
  next: post_step

post_step:
  call: http.post
  args:
    url: "[#ANALYTICS_RESQL]/feedback-avg-feedback-to-buerokratt-chats"
    body:
      metric: ${incoming.body.metric}
      start: ${incoming.body.start_date}
      end: ${incoming.body.end_date}
      urls: ${incoming.body.urls}
      showTest: ${incoming.body.showTest}
  result: result
  next: return_value

post_step_combined:
  call: http.post
  args:
    url: "[#ANALYTICS_RESQL]/overview-feedback-avg-range"
    body:
      start: ${incoming.body.start_date}
      end: ${incoming.body.end_date}
      urls: ${incoming.body.urls}
      showTest: ${incoming.body.showTest}
  result: result
  next: return_value

return_value:
  return: ${result.response.body}
  next: end

return_incorrect_request:
  status: 400
  return: 'missing parameters'
  next: end
